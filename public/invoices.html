<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Embedded widget invoice cards</title><style>body{font:15px system-ui;color:#314351;margin:16px}#controls{display:flex;flex-wrap:wrap;gap:8px}#frame{width:598px;max-width:100%;min-width:0}#docsbot-widget-embed{height:1100px}button{padding:8px}#metrics{overflow-wrap:anywhere}</style><h1>Embedded widget · fictional invoices</h1><p>Eight ordered invoices, local button handling, no model or business operations.</p><div id="controls"></div><p id="metrics" role="status">Loading widget…</p><p id="action" role="status">Local actions 0</p><div id="frame"><div id="docsbot-widget-embed"></div></div><script src="/chat.js"></script><script type="module">
import {invoiceProgram,measureInvoiceLayout} from './invoiceFixture.mjs';
let width=598,maximum=8,nested=false,actions=0,ready=false;
const frame=document.getElementById('frame'),metrics=document.getElementById('metrics');
let layoutRoot=frame;
const footerMetrics=()=>{const surfaces=layoutRoot.querySelectorAll('.docsbot-openui-surface'),surface=surfaces[surfaces.length-1],input=layoutRoot.querySelector('.docsbot-chat-input-container'),scroller=layoutRoot.querySelector('.docsbot-chat-message-container');if(!surface||!input||!scroller)return '';return `; card/composer clearance ${Math.round(input.getBoundingClientRect().top-surface.getBoundingClientRect().bottom)}px; composer height ${Math.round(input.getBoundingClientRect().height)}px; scroll remaining ${Math.round(scroller.scrollHeight-scroller.clientHeight-scroller.scrollTop)}px`};
const updateMetrics=()=>{metrics.textContent=`Embed ${width}px; requested maximum ${maximum}. ${measureInvoiceLayout(layoutRoot)}${footerMetrics()}`};
const load=async()=>{if(!ready)return;await DocsBotAI.addUIMessage({response:invoiceProgram(maximum,{nested}),message:'Fictional invoice demo. Conversation-only buttons.'});requestAnimationFrame(updateMetrics)};
for(const n of [320,390,540,598,1080]){const button=document.createElement('button');button.textContent=`Width ${n}`;button.onclick=()=>{width=n;frame.style.width=n+'px';requestAnimationFrame(updateMetrics)};document.getElementById('controls').append(button)}
for(const n of [1,2,8]){const button=document.createElement('button');button.textContent=`Max ${n}`;button.onclick=()=>{maximum=n;load()};document.getElementById('controls').append(button)}
const button=document.createElement('button');button.textContent='Toggle nested';button.onclick=()=>{nested=!nested;load()};document.getElementById('controls').append(button);
document.addEventListener('docsbot_ui_action',event=>{event.preventDefault();actions++;document.getElementById('action').textContent=`Local actions ${actions}; no API request`;event.detail.respondWith(new Promise(resolve=>setTimeout(()=>resolve(true),350)))});
new ResizeObserver(()=>requestAnimationFrame(updateMetrics)).observe(frame);
await DocsBotAI.mount({id:'nG4F5A3BFSBzdYc5TZIX/uy8srweloFNgRadNtwvf',options:{localDev:true,localApiBase:'http://127.0.0.1:9000',useGenerativeUI:false,isAgent:true,useVoiceAgent:false,useWebSearch:false,useCustomButtons:false,useFeedback:false,useEscalation:false,useImageUpload:false,useAudioUpload:false,testing:true,questions:[]}});layoutRoot=document.getElementById('docsbotai-root').shadowRoot || frame;new MutationObserver(()=>requestAnimationFrame(updateMetrics)).observe(layoutRoot,{childList:true,subtree:true});layoutRoot.querySelector('.docsbot-chat-message-container')?.addEventListener('scroll',updateMetrics);const composer=layoutRoot.querySelector('.docsbot-chat-input-container');if(composer)new ResizeObserver(updateMetrics).observe(composer);ready=true;await load();
</script></html>
