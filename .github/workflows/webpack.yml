name: Build and deploy Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.npmrc'
      - '.node-version'
      - 'package*.json'
      - 'scripts/release-manifest*'

permissions:
  contents: read

# Serialize production releases without interrupting an upload already in progress.
concurrency:
  group: widget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify bundled npm
        run: test "$(npm --version)" = 11.19.1
      - name: Install the reviewed dependency tree without install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test helpers and release manifest
        run: node --test src/utils/*.test.mjs src/components/generativeUi/*.test.mjs scripts/release-manifest.test.mjs
      - name: Build once, explicitly
        run: npm run build
      - name: Record release file hashes
        id: manifest
        run: |
          node scripts/release-manifest.mjs create build "$GITHUB_SHA"
          echo "sha256=$(sha256sum build/release-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain complete release for inspection and recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-release-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 90

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: widget-release-${{ github.sha }}
          path: release/
      - name: Verify exact build output before making credentials available
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: node scripts/release-manifest.mjs verify release "$GITHUB_SHA" "$EXPECTED_MANIFEST_SHA256"
      # No npm installation or application code runs in this job.
      - name: Deploy verified artifact to R2 Storage
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # snapshot of latest, 2026-11-17
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: release
          destination-dir: ./
          keep-file-fresh: true
          output-file-url: false
